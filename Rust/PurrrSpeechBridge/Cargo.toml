[package]
name = "purrr-speech-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "purrr_speech_bridge"
crate-type = ["staticlib"]

[dependencies]
koe-asr = { git = "https://github.com/missuo/koe.git", rev = "aedc9747564dc5ec5a0203827edb4d6d67909bc0" }
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "sync", "time"] }

# Work around malformed proc-macro dylibs produced by optimized host builds on
# current macOS/Xcode toolchains. This changes build scripts and macros only;
# the final bridge remains fully optimized.
[profile.release.build-override]
debug = 2
codegen-units = 256
