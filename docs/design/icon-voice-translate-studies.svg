<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#292C33"/>
      <stop offset="1" stop-color="#15171C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.14"/>
    </filter>

    <mask id="split-capsule-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="160">
      <rect x="7" y="47" width="146" height="66" rx="27" fill="#FFFFFF"/>
      <rect x="34" y="71" width="10" height="18" rx="5" fill="#000000"/>
      <rect x="51" y="61" width="10" height="38" rx="5" fill="#000000"/>
      <rect x="68" y="69" width="10" height="22" rx="5" fill="#000000"/>
      <path d="M96 99L113 61L130 99M102 86H124" fill="none" stroke="#000000" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>

    <mask id="exchange-foreground-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="160">
      <rect x="63" y="58" width="82" height="82" rx="23" fill="#FFFFFF"/>
      <path d="M83 119L104 77L125 119M91 103H117" fill="none" stroke="#000000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>

    <symbol id="split-capsule" viewBox="0 0 160 160">
      <rect width="160" height="160" fill="currentColor" mask="url(#split-capsule-mask)"/>
    </symbol>

    <symbol id="open-pair" viewBox="0 0 160 160">
      <rect x="14" y="67" width="13" height="26" rx="6.5" fill="currentColor"/>
      <rect x="37" y="51" width="13" height="58" rx="6.5" fill="currentColor"/>
      <rect x="60" y="62" width="13" height="36" rx="6.5" fill="currentColor"/>
      <path d="M91 112L116 48L142 112M101 89H132" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <symbol id="translate-key" viewBox="0 0 160 160">
      <rect x="13" y="28" width="134" height="104" rx="27" fill="none" stroke="currentColor" stroke-width="14"/>
      <path d="M80 42V118" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
      <rect x="31" y="68" width="10" height="24" rx="5" fill="currentColor"/>
      <rect x="49" y="55" width="10" height="50" rx="5" fill="currentColor"/>
      <rect x="67" y="66" width="10" height="28" rx="5" fill="currentColor"/>
      <path d="M91 104L111 56L132 104M98 87H125" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <symbol id="voice-lines" viewBox="0 0 160 160">
      <rect x="13" y="68" width="12" height="24" rx="6" fill="currentColor"/>
      <rect x="34" y="52" width="12" height="56" rx="6" fill="currentColor"/>
      <rect x="55" y="63" width="12" height="34" rx="6" fill="currentColor"/>
      <path d="M90 55H143M90 80H132M90 105H143" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"/>
    </symbol>

    <symbol id="voice-han" viewBox="0 0 160 160">
      <rect x="13" y="68" width="12" height="24" rx="6" fill="currentColor"/>
      <rect x="34" y="52" width="12" height="56" rx="6" fill="currentColor"/>
      <rect x="55" y="63" width="12" height="34" rx="6" fill="currentColor"/>
      <g fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
        <path d="M112 37V47"/>
        <path d="M85 59H139"/>
        <path d="M99 68C101 89 114 110 138 122"/>
        <path d="M128 68C123 92 108 112 86 123"/>
      </g>
    </symbol>

    <symbol id="exchange-tiles" viewBox="0 0 160 160">
      <rect x="15" y="25" width="83" height="83" rx="23" fill="none" stroke="currentColor" stroke-width="13"/>
      <rect x="34" y="57" width="10" height="20" rx="5" fill="currentColor"/>
      <rect x="51" y="45" width="10" height="44" rx="5" fill="currentColor"/>
      <rect x="68" y="54" width="10" height="26" rx="5" fill="currentColor"/>
      <rect width="160" height="160" fill="currentColor" mask="url(#exchange-foreground-mask)"/>
    </symbol>
  </defs>

  <rect width="1440" height="1040" fill="#F4F4F6"/>
  <text x="72" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="700" fill="#17181C">Purrr — Voice + Translation</text>
  <text x="72" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" fill="#666A73">Voice on the left · translated text on the right</text>

  <g transform="translate(70 150)">
    <rect width="410" height="400" rx="28" fill="#FFFFFF"/>
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="650" fill="#24262B">01 · Split Capsule</text>
    <rect x="28" y="72" width="250" height="250" rx="56" fill="url(#tile)" filter="url(#shadow)"/>
    <g transform="translate(73 117)"><use href="#split-capsule" width="160" height="160" color="#1687FF" style="--cut:#191B20"/></g>
    <rect x="306" y="96" width="72" height="42" rx="12" fill="#F2F2F4"/>
    <g transform="translate(326 101) scale(.2)"><use href="#split-capsule" width="160" height="160" color="#15161A" style="--cut:#F2F2F4"/></g>
    <rect x="306" y="156" width="72" height="42" rx="12" fill="#1A1B20"/>
    <g transform="translate(326 161) scale(.2)"><use href="#split-capsule" width="160" height="160" color="#FFFFFF" style="--cut:#1A1B20"/></g>
    <text x="28" y="364" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#676B74">one surface containing voice and text</text>
  </g>

  <g transform="translate(515 150)">
    <rect width="410" height="400" rx="28" fill="#FFFFFF"/>
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="650" fill="#24262B">02 · Open Pair</text>
    <rect x="28" y="72" width="250" height="250" rx="56" fill="url(#tile)" filter="url(#shadow)"/>
    <g transform="translate(73 117)"><use href="#open-pair" width="160" height="160" color="#1687FF"/></g>
    <rect x="306" y="96" width="72" height="42" rx="12" fill="#F2F2F4"/>
    <g transform="translate(326 101) scale(.2)"><use href="#open-pair" width="160" height="160" color="#15161A"/></g>
    <rect x="306" y="156" width="72" height="42" rx="12" fill="#1A1B20"/>
    <g transform="translate(326 161) scale(.2)"><use href="#open-pair" width="160" height="160" color="#FFFFFF"/></g>
    <text x="28" y="364" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#676B74">the clearest voice-to-language pair</text>
  </g>

  <g transform="translate(960 150)">
    <rect width="410" height="400" rx="28" fill="#FFFFFF"/>
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="650" fill="#24262B">03 · Translate Key</text>
    <rect x="28" y="72" width="250" height="250" rx="56" fill="url(#tile)" filter="url(#shadow)"/>
    <g transform="translate(73 117)"><use href="#translate-key" width="160" height="160" color="#1687FF"/></g>
    <rect x="306" y="96" width="72" height="42" rx="12" fill="#F2F2F4"/>
    <g transform="translate(326 101) scale(.2)"><use href="#translate-key" width="160" height="160" color="#15161A"/></g>
    <rect x="306" y="156" width="72" height="42" rx="12" fill="#1A1B20"/>
    <g transform="translate(326 161) scale(.2)"><use href="#translate-key" width="160" height="160" color="#FFFFFF"/></g>
    <text x="28" y="364" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#676B74">a keycap explicitly divided in two</text>
  </g>

  <g transform="translate(70 585)">
    <rect width="410" height="400" rx="28" fill="#FFFFFF"/>
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="650" fill="#24262B">04 · Voice to Lines</text>
    <rect x="28" y="72" width="250" height="250" rx="56" fill="url(#tile)" filter="url(#shadow)"/>
    <g transform="translate(73 117)"><use href="#voice-lines" width="160" height="160" color="#1687FF"/></g>
    <rect x="306" y="96" width="72" height="42" rx="12" fill="#F2F2F4"/>
    <g transform="translate(326 101) scale(.2)"><use href="#voice-lines" width="160" height="160" color="#15161A"/></g>
    <rect x="306" y="156" width="72" height="42" rx="12" fill="#1A1B20"/>
    <g transform="translate(326 161) scale(.2)"><use href="#voice-lines" width="160" height="160" color="#FFFFFF"/></g>
    <text x="28" y="364" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#676B74">language-neutral transcription output</text>
  </g>

  <g transform="translate(515 585)">
    <rect width="410" height="400" rx="28" fill="#FFFFFF"/>
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="650" fill="#24262B">05 · Voice + Han</text>
    <rect x="28" y="72" width="250" height="250" rx="56" fill="url(#tile)" filter="url(#shadow)"/>
    <g transform="translate(73 117)"><use href="#voice-han" width="160" height="160" color="#1687FF"/></g>
    <rect x="306" y="96" width="72" height="42" rx="12" fill="#F2F2F4"/>
    <g transform="translate(326 101) scale(.2)"><use href="#voice-han" width="160" height="160" color="#15161A"/></g>
    <rect x="306" y="156" width="72" height="42" rx="12" fill="#1A1B20"/>
    <g transform="translate(326 161) scale(.2)"><use href="#voice-han" width="160" height="160" color="#FFFFFF"/></g>
    <text x="28" y="364" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#676B74">voice paired with a second script</text>
  </g>

  <g transform="translate(960 585)">
    <rect width="410" height="400" rx="28" fill="#FFFFFF"/>
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="650" fill="#24262B">06 · Exchange Tiles</text>
    <rect x="28" y="72" width="250" height="250" rx="56" fill="url(#tile)" filter="url(#shadow)"/>
    <g transform="translate(73 117)"><use href="#exchange-tiles" width="160" height="160" color="#1687FF" style="--cut:#191B20"/></g>
    <rect x="306" y="96" width="72" height="42" rx="12" fill="#F2F2F4"/>
    <g transform="translate(326 101) scale(.2)"><use href="#exchange-tiles" width="160" height="160" color="#15161A" style="--cut:#F2F2F4"/></g>
    <rect x="306" y="156" width="72" height="42" rx="12" fill="#1A1B20"/>
    <g transform="translate(326 161) scale(.2)"><use href="#exchange-tiles" width="160" height="160" color="#FFFFFF" style="--cut:#1A1B20"/></g>
    <text x="28" y="364" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#676B74">overlap communicates transformation</text>
  </g>
</svg>
