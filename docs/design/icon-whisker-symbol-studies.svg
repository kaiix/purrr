<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#292C33"/>
      <stop offset="1" stop-color="#15171C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.14"/>
    </filter>

    <symbol id="brackets" viewBox="0 0 160 160">
      <g fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
        <path d="M53 39L20 80L53 121"/>
        <path d="M107 39L140 80L107 121"/>
      </g>
    </symbol>

    <symbol id="sound" viewBox="0 0 160 160">
      <use href="#brackets" width="160" height="160"/>
      <rect x="59" y="69" width="10" height="22" rx="5" fill="currentColor"/>
      <rect x="75" y="55" width="10" height="50" rx="5" fill="currentColor"/>
      <rect x="91" y="64" width="10" height="32" rx="5" fill="currentColor"/>
    </symbol>

    <symbol id="voiceprint" viewBox="0 0 160 160">
      <use href="#brackets" width="160" height="160"/>
      <rect x="56" y="71" width="8" height="18" rx="4" fill="currentColor"/>
      <rect x="68" y="60" width="8" height="40" rx="4" fill="currentColor"/>
      <rect x="80" y="50" width="8" height="60" rx="4" fill="currentColor"/>
      <rect x="92" y="64" width="8" height="32" rx="4" fill="currentColor"/>
    </symbol>

    <symbol id="meow" viewBox="0 0 160 160">
      <use href="#brackets" width="160" height="160"/>
      <path d="M57 103V58L80 83L103 58V103" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <symbol id="purr" viewBox="0 0 160 160">
      <use href="#brackets" width="160" height="160"/>
      <g fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round">
        <path d="M58 65C64 55 70 75 76 65C82 55 88 75 94 65C100 55 106 75 112 65"/>
        <path d="M58 82C64 72 70 92 76 82C82 72 88 92 94 82C100 72 106 92 112 82"/>
        <path d="M58 99C64 89 70 109 76 99C82 89 88 109 94 99C100 89 106 109 112 99"/>
      </g>
    </symbol>

    <symbol id="keyboard" viewBox="0 0 160 160">
      <use href="#brackets" width="160" height="160"/>
      <rect x="56" y="61" width="18" height="18" rx="5" fill="currentColor"/>
      <rect x="80" y="61" width="18" height="18" rx="5" fill="currentColor"/>
      <rect x="104" y="61" width="0" height="0" fill="none"/>
      <rect x="68" y="85" width="34" height="14" rx="5" fill="currentColor"/>
    </symbol>

    <symbol id="microphone" viewBox="0 0 160 160">
      <use href="#brackets" width="160" height="160"/>
      <rect x="69" y="45" width="22" height="48" rx="11" fill="currentColor"/>
      <path d="M59 78V84C59 98 68 107 80 107C92 107 101 98 101 84V78M80 107V119M67 119H93" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect width="1440" height="1040" fill="#F4F4F6"/>
  <text x="72" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="700" fill="#17181C">Purrr — Whisker Symbol Studies</text>
  <text x="72" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" fill="#666A73">One geometric family · six semantic cores · app icon and 18 pt menu bar proofs</text>

  <g transform="translate(70 150)">
    <rect width="410" height="400" rx="28" fill="#FFFFFF"/>
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="650" fill="#24262B">01 · Sound</text>
    <rect x="28" y="72" width="250" height="250" rx="56" fill="url(#tile)" filter="url(#shadow)"/>
    <g transform="translate(73 117)"><use href="#sound" width="160" height="160" color="#1687FF"/></g>
    <rect x="306" y="96" width="72" height="42" rx="12" fill="#F2F2F4"/>
    <g transform="translate(326 101) scale(.2)"><use href="#sound" width="160" height="160" color="#15161A"/></g>
    <rect x="306" y="156" width="72" height="42" rx="12" fill="#1A1B20"/>
    <g transform="translate(326 161) scale(.2)"><use href="#sound" width="160" height="160" color="#FFFFFF"/></g>
    <text x="28" y="364" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#676B74">asymmetric live audio levels</text>
  </g>

  <g transform="translate(515 150)">
    <rect width="410" height="400" rx="28" fill="#FFFFFF"/>
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="650" fill="#24262B">02 · Voiceprint</text>
    <rect x="28" y="72" width="250" height="250" rx="56" fill="url(#tile)" filter="url(#shadow)"/>
    <g transform="translate(73 117)"><use href="#voiceprint" width="160" height="160" color="#1687FF"/></g>
    <rect x="306" y="96" width="72" height="42" rx="12" fill="#F2F2F4"/>
    <g transform="translate(326 101) scale(.2)"><use href="#voiceprint" width="160" height="160" color="#15161A"/></g>
    <rect x="306" y="156" width="72" height="42" rx="12" fill="#1A1B20"/>
    <g transform="translate(326 161) scale(.2)"><use href="#voiceprint" width="160" height="160" color="#FFFFFF"/></g>
    <text x="28" y="364" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#676B74">compact voice signature</text>
  </g>

  <g transform="translate(960 150)">
    <rect width="410" height="400" rx="28" fill="#FFFFFF"/>
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="650" fill="#24262B">03 · Meow</text>
    <rect x="28" y="72" width="250" height="250" rx="56" fill="url(#tile)" filter="url(#shadow)"/>
    <g transform="translate(73 117)"><use href="#meow" width="160" height="160" color="#1687FF"/></g>
    <rect x="306" y="96" width="72" height="42" rx="12" fill="#F2F2F4"/>
    <g transform="translate(326 101) scale(.2)"><use href="#meow" width="160" height="160" color="#15161A"/></g>
    <rect x="306" y="156" width="72" height="42" rx="12" fill="#1A1B20"/>
    <g transform="translate(326 161) scale(.2)"><use href="#meow" width="160" height="160" color="#FFFFFF"/></g>
    <text x="28" y="364" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#676B74">geometric M with ear peaks</text>
  </g>

  <g transform="translate(70 585)">
    <rect width="410" height="400" rx="28" fill="#FFFFFF"/>
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="650" fill="#24262B">04 · Purr</text>
    <rect x="28" y="72" width="250" height="250" rx="56" fill="url(#tile)" filter="url(#shadow)"/>
    <g transform="translate(73 117)"><use href="#purr" width="160" height="160" color="#1687FF"/></g>
    <rect x="306" y="96" width="72" height="42" rx="12" fill="#F2F2F4"/>
    <g transform="translate(326 101) scale(.2)"><use href="#purr" width="160" height="160" color="#15161A"/></g>
    <rect x="306" y="156" width="72" height="42" rx="12" fill="#1A1B20"/>
    <g transform="translate(326 161) scale(.2)"><use href="#purr" width="160" height="160" color="#FFFFFF"/></g>
    <text x="28" y="364" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#676B74">three low-frequency vibrations</text>
  </g>

  <g transform="translate(515 585)">
    <rect width="410" height="400" rx="28" fill="#FFFFFF"/>
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="650" fill="#24262B">05 · Keyboard</text>
    <rect x="28" y="72" width="250" height="250" rx="56" fill="url(#tile)" filter="url(#shadow)"/>
    <g transform="translate(73 117)"><use href="#keyboard" width="160" height="160" color="#1687FF"/></g>
    <rect x="306" y="96" width="72" height="42" rx="12" fill="#F2F2F4"/>
    <g transform="translate(326 101) scale(.2)"><use href="#keyboard" width="160" height="160" color="#15161A"/></g>
    <rect x="306" y="156" width="72" height="42" rx="12" fill="#1A1B20"/>
    <g transform="translate(326 161) scale(.2)"><use href="#keyboard" width="160" height="160" color="#FFFFFF"/></g>
    <text x="28" y="364" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#676B74">two keys and a space bar</text>
  </g>

  <g transform="translate(960 585)">
    <rect width="410" height="400" rx="28" fill="#FFFFFF"/>
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="650" fill="#24262B">06 · Microphone</text>
    <rect x="28" y="72" width="250" height="250" rx="56" fill="url(#tile)" filter="url(#shadow)"/>
    <g transform="translate(73 117)"><use href="#microphone" width="160" height="160" color="#1687FF"/></g>
    <rect x="306" y="96" width="72" height="42" rx="12" fill="#F2F2F4"/>
    <g transform="translate(326 101) scale(.2)"><use href="#microphone" width="160" height="160" color="#15161A"/></g>
    <rect x="306" y="156" width="72" height="42" rx="12" fill="#1A1B20"/>
    <g transform="translate(326 161) scale(.2)"><use href="#microphone" width="160" height="160" color="#FFFFFF"/></g>
    <text x="28" y="364" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#676B74">voice input with a compact stand</text>
