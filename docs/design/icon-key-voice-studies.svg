<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#292C33"/>
      <stop offset="1" stop-color="#15171C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.14"/>
    </filter>

    <symbol id="ink-key" viewBox="0 0 160 160">
      <rect x="21" y="27" width="118" height="106" rx="27" fill="currentColor"/>
      <rect x="49" y="69" width="14" height="25" rx="7" fill="var(--cut, #15171C)"/>
      <rect x="73" y="54" width="14" height="55" rx="7" fill="var(--cut, #15171C)"/>
      <rect x="97" y="69" width="14" height="25" rx="7" fill="var(--cut, #15171C)"/>
    </symbol>

    <symbol id="line-key" viewBox="0 0 160 160">
      <rect x="19" y="29" width="122" height="102" rx="26" fill="none" stroke="currentColor" stroke-width="15"/>
      <rect x="48" y="68" width="14" height="27" rx="7" fill="currentColor"/>
      <rect x="73" y="53" width="14" height="57" rx="7" fill="currentColor"/>
      <rect x="98" y="68" width="14" height="27" rx="7" fill="currentColor"/>
    </symbol>

    <symbol id="space-pulse" viewBox="0 0 160 160">
      <rect x="9" y="48" width="142" height="64" rx="25" fill="currentColor"/>
      <rect x="35" y="72" width="10" height="16" rx="5" fill="var(--cut, #15171C)"/>
      <rect x="55" y="65" width="10" height="30" rx="5" fill="var(--cut, #15171C)"/>
      <rect x="75" y="58" width="10" height="44" rx="5" fill="var(--cut, #15171C)"/>
      <rect x="95" y="65" width="10" height="30" rx="5" fill="var(--cut, #15171C)"/>
      <rect x="115" y="72" width="10" height="16" rx="5" fill="var(--cut, #15171C)"/>
    </symbol>

    <symbol id="rising-voice" viewBox="0 0 160 160">
      <path d="M21 68V109C21 123 32 133 46 133H114C128 133 139 123 139 109V68" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round"/>
      <rect x="43" y="61" width="16" height="37" rx="8" fill="currentColor"/>
      <rect x="72" y="24" width="16" height="83" rx="8" fill="currentColor"/>
      <rect x="101" y="48" width="16" height="50" rx="8" fill="currentColor"/>
    </symbol>

    <symbol id="corner-key" viewBox="0 0 160 160">
      <g fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
        <path d="M54 29H38C27 29 20 36 20 47V61"/>
        <path d="M106 29H122C133 29 140 36 140 47V61"/>
        <path d="M54 131H38C27 131 20 124 20 113V99"/>
        <path d="M106 131H122C133 131 140 124 140 113V99"/>
      </g>
      <rect x="48" y="67" width="14" height="27" rx="7" fill="currentColor"/>
      <rect x="73" y="52" width="14" height="57" rx="7" fill="currentColor"/>
      <rect x="98" y="67" width="14" height="27" rx="7" fill="currentColor"/>
    </symbol>

    <symbol id="pressed-key" viewBox="0 0 160 160">
      <rect x="24" y="38" width="112" height="86" rx="23" fill="none" stroke="currentColor" stroke-width="15"/>
      <path d="M43 132H117" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round"/>
      <rect x="49" y="69" width="14" height="25" rx="7" fill="currentColor"/>
      <rect x="73" y="55" width="14" height="53" rx="7" fill="currentColor"/>
      <rect x="97" y="69" width="14" height="25" rx="7" fill="currentColor"/>
    </symbol>
  </defs>

  <rect width="1440" height="1040" fill="#F4F4F6"/>
  <text x="72" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="700" fill="#17181C">Purrr — Key + Voiceprint</text>
  <text x="72" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" fill="#666A73">Six geometric constructions · app icon and menu bar proof</text>

  <g transform="translate(70 150)">
    <rect width="410" height="400" rx="28" fill="#FFFFFF"/>
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="650" fill="#24262B">01 · Ink Key</text>
    <rect x="28" y="72" width="250" height="250" rx="56" fill="url(#tile)" filter="url(#shadow)"/>
    <g transform="translate(73 117)"><use href="#ink-key" width="160" height="160" color="#1687FF" style="--cut:#191B20"/></g>
    <rect x="306" y="96" width="72" height="42" rx="12" fill="#F2F2F4"/>
    <g transform="translate(326 101) scale(.2)"><use href="#ink-key" width="160" height="160" color="#15161A" style="--cut:#F2F2F4"/></g>
    <rect x="306" y="156" width="72" height="42" rx="12" fill="#1A1B20"/>
    <g transform="translate(326 161) scale(.2)"><use href="#ink-key" width="160" height="160" color="#FFFFFF" style="--cut:#1A1B20"/></g>
    <text x="28" y="364" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#676B74">voiceprint cut from a solid keycap</text>
  </g>

  <g transform="translate(515 150)">
    <rect width="410" height="400" rx="28" fill="#FFFFFF"/>
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="650" fill="#24262B">02 · Line Key</text>
    <rect x="28" y="72" width="250" height="250" rx="56" fill="url(#tile)" filter="url(#shadow)"/>
    <g transform="translate(73 117)"><use href="#line-key" width="160" height="160" color="#1687FF"/></g>
    <rect x="306" y="96" width="72" height="42" rx="12" fill="#F2F2F4"/>
    <g transform="translate(326 101) scale(.2)"><use href="#line-key" width="160" height="160" color="#15161A"/></g>
    <rect x="306" y="156" width="72" height="42" rx="12" fill="#1A1B20"/>
    <g transform="translate(326 161) scale(.2)"><use href="#line-key" width="160" height="160" color="#FFFFFF"/></g>
    <text x="28" y="364" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#676B74">outlined keycap with solid voice bars</text>
  </g>

  <g transform="translate(960 150)">
    <rect width="410" height="400" rx="28" fill="#FFFFFF"/>
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="650" fill="#24262B">03 · Space Pulse</text>
    <rect x="28" y="72" width="250" height="250" rx="56" fill="url(#tile)" filter="url(#shadow)"/>
    <g transform="translate(73 117)"><use href="#space-pulse" width="160" height="160" color="#1687FF" style="--cut:#191B20"/></g>
    <rect x="306" y="96" width="72" height="42" rx="12" fill="#F2F2F4"/>
    <g transform="translate(326 101) scale(.2)"><use href="#space-pulse" width="160" height="160" color="#15161A" style="--cut:#F2F2F4"/></g>
    <rect x="306" y="156" width="72" height="42" rx="12" fill="#1A1B20"/>
    <g transform="translate(326 161) scale(.2)"><use href="#space-pulse" width="160" height="160" color="#FFFFFF" style="--cut:#1A1B20"/></g>
    <text x="28" y="364" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#676B74">the default Space shortcut as a mark</text>
  </g>

  <g transform="translate(70 585)">
    <rect width="410" height="400" rx="28" fill="#FFFFFF"/>
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="650" fill="#24262B">04 · Rising Voice</text>
    <rect x="28" y="72" width="250" height="250" rx="56" fill="url(#tile)" filter="url(#shadow)"/>
    <g transform="translate(73 117)"><use href="#rising-voice" width="160" height="160" color="#1687FF"/></g>
    <rect x="306" y="96" width="72" height="42" rx="12" fill="#F2F2F4"/>
    <g transform="translate(326 101) scale(.2)"><use href="#rising-voice" width="160" height="160" color="#15161A"/></g>
    <rect x="306" y="156" width="72" height="42" rx="12" fill="#1A1B20"/>
    <g transform="translate(326 161) scale(.2)"><use href="#rising-voice" width="160" height="160" color="#FFFFFF"/></g>
    <text x="28" y="364" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#676B74">voice breaking through the key edge</text>
  </g>

  <g transform="translate(515 585)">
    <rect width="410" height="400" rx="28" fill="#FFFFFF"/>
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="650" fill="#24262B">05 · Corner Key</text>
    <rect x="28" y="72" width="250" height="250" rx="56" fill="url(#tile)" filter="url(#shadow)"/>
    <g transform="translate(73 117)"><use href="#corner-key" width="160" height="160" color="#1687FF"/></g>
    <rect x="306" y="96" width="72" height="42" rx="12" fill="#F2F2F4"/>
    <g transform="translate(326 101) scale(.2)"><use href="#corner-key" width="160" height="160" color="#15161A"/></g>
    <rect x="306" y="156" width="72" height="42" rx="12" fill="#1A1B20"/>
    <g transform="translate(326 161) scale(.2)"><use href="#corner-key" width="160" height="160" color="#FFFFFF"/></g>
    <text x="28" y="364" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#676B74">only the minimum keycap geometry</text>
  </g>

  <g transform="translate(960 585)">
    <rect width="410" height="400" rx="28" fill="#FFFFFF"/>
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="650" fill="#24262B">06 · Pressed Key</text>
    <rect x="28" y="72" width="250" height="250" rx="56" fill="url(#tile)" filter="url(#shadow)"/>
    <g transform="translate(73 117)"><use href="#pressed-key" width="160" height="160" color="#1687FF"/></g>
    <rect x="306" y="96" width="72" height="42" rx="12" fill="#F2F2F4"/>
    <g transform="translate(326 101) scale(.2)"><use href="#pressed-key" width="160" height="160" color="#15161A"/></g>
    <rect x="306" y="156" width="72" height="42" rx="12" fill="#1A1B20"/>
    <g transform="translate(326 161) scale(.2)"><use href="#pressed-key" width="160" height="160" color="#FFFFFF"/></g>
    <text x="28" y="364" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#676B74">a lower baseline implies key travel</text>
  </g>
</svg>
